name: CT certificate watch

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: 'Explicitly replace baseline without notifying existing issuances'
        type: boolean
        default: false

permissions:
  contents: read

# Initialization and monitoring share a lock. Do not cancel an in-flight Slack/save.
concurrency:
  group: ct-state
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore request budget and polling deadlines
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact=$(gh api --method GET "repos/$GH_REPO/actions/artifacts" -f name=ct-runtime -f per_page=1 --jq '.artifacts[0].id // empty')
          if [[ -n "$artifact" ]]; then
            gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/ct-runtime.zip"
            unzip -p "$RUNNER_TEMP/ct-runtime.zip" ct-runtime.json > "$RUNNER_TEMP/ct-runtime.json"
          fi
      - name: Load state branch
        id: state
        env:
          CT_INITIALIZE: ${{ inputs.initialize == true }}
          CT_STATE_FILE: ${{ runner.temp }}/ct-state.json
        run: bash scripts/ct-state.sh load
      - name: Fetch pages, checkpoint, and notify on completion
        id: fetch
        env:
          CERTSPOTTER_API_KEY: ${{ secrets.CERTSPOTTER_API_KEY }}
          NOTIFY_SLACK_TOKEN: ${{ secrets.NOTIFY_SLACK_TOKEN }}
          NOTIFY_SLACK_CHANNEL_ID: ${{ secrets.NOTIFY_SLACK_CHANNEL_ID }}
          CT_INITIALIZE: ${{ inputs.initialize == true }}
        run: |
          args=()
          if [[ "$CT_INITIALIZE" == true ]]; then args=(-initialize); fi
          go run ./cmd/ct-watch -runtime "$RUNNER_TEMP/ct-runtime.json" -state "$RUNNER_TEMP/ct-state.json" "${args[@]}"
      - name: Persist acknowledged cursors or incomplete acquisition
        if: always() && steps.state.outcome == 'success' && steps.fetch.outcome != 'skipped'
        env:
          CT_STATE_FILE: ${{ runner.temp }}/ct-state.json
        run: |
          if [[ -f "$CT_STATE_FILE" ]]; then bash scripts/ct-state.sh save; fi
      - name: Preserve rate limits even when acquisition is incomplete
        if: always() && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ct-runtime
          path: ${{ runner.temp }}/ct-runtime.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

name: Test

on:
  push:
    branches-ignore:
      - ct-state
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: openssl version
      - run: go test ./...
      - run: go vet ./...

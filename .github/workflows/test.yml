name: Test

on:
  push:
    branches-ignore:
      - ct-state
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: openssl version
      - run: go test ./...
      - run: go vet ./...

name: CT acquisition health
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  actions: read
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a successful CT acquisition in the last 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api --method GET "repos/$GH_REPO/actions/workflows/ct-watch.yml/runs" \
            -f status=success -f branch="$DEFAULT_BRANCH" -f per_page=1 > "$RUNNER_TEMP/ct-runs.json"
          python3 - <<'PY'
          import datetime, json, os
          with open(os.environ['RUNNER_TEMP'] + '/ct-runs.json') as f:
              runs = json.load(f)['workflow_runs']
          now = datetime.datetime.now(datetime.timezone.utc)
          if not runs or now - datetime.datetime.fromisoformat(runs[0]['updated_at'].replace('Z', '+00:00')) > datetime.timedelta(hours=24):
              raise SystemExit('::error::No successful complete CT acquisition/state save in the last 24 hours')
          print('CT acquisition is healthy')
          PY
